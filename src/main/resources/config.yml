# ImmersiveMelodies Folia 配置
# 移植自原模组 Config.java

# 人性化参数（让演奏更自然）
humanization-time: 20
humanization-volume: 0.06
humanization-pitch: 0.02
humanization-length: 0.04

# 音量与响度
instrument-volume-factor: 1.0
perceived-loudness-adjustment-factor: 0.5
# 传播距离倍率（Bukkit 音量 = 距离半径，1.0 = 16 格）
range-factor: 2.0

# 首次启动会自动释放 jar 内置的全部 MIDI 旋律到 melodies/ 目录

# 可演奏生物（自然生成时按概率装备随机乐器并自动演奏）
# 与原模组 Config.mobInstrumentFactors 一致，可随时增删改；
# key 为实体类型命名空间 id，value 为 0~1 的生成概率。
mob-instruments:
  minecraft:zombie: 0.01
  minecraft:husk: 0.01
  minecraft:skeleton: 0.01
  minecraft:wither_skeleton: 0.01
  minecraft:piglin_brute: 0.01
  minecraft:piglin: 0.01
  minecraft:zombified_piglin: 0.01
  minecraft:pillager: 0.01

# 带乐器的怪物是否不攻击玩家（true = 只演奏不攻击，服务端适配；原模组怪物仍会攻击）
mob-instrument-peaceful: true
# 生物自动演奏时的合奏搜索半径（格），附近有同曲目演奏者则对齐起始时间
mob-ensemble-radius: 32
